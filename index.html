<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7ec8ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>ゲーム</title>
  <link rel="stylesheet" href="hub.css">
</head>
<body>
  <main class="hub">
    <h1 class="hub-title">ゲーム</h1>
    <p class="hub-lead">あそびたいゲームをタッチしてね</p>
    <nav class="hub-cards" aria-label="ゲーム">
      <a class="card card-awase" href="/awase/">
        <span class="card-emoji" aria-hidden="true">🃏</span>
        <span class="card-name">なかまあわせ</span>
        <span class="card-hint">おなじえをさがそう</span>
      </a>
      <a class="card card-mine" href="/minesweeper/">
        <span class="card-emoji" aria-hidden="true">💣</span>
        <span class="card-name">スーパーマインスイーパー</span>
        <span class="card-hint">ばくだんをさけてひらこう</span>
      </a>
      <a class="card card-nurie" href="/nurie/">
        <span class="card-emoji" aria-hidden="true">🎨</span>
        <span class="card-name">ぬりえ</span>
        <span class="card-hint">ヒーローをぬってね</span>
      </a>
    </nav>
  </main>
</body>
</html>
