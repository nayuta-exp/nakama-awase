<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1a2230">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>かいじゅうさがし</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="hub-back" href="/">もどる</a>

  <section class="screen is-on" id="start" aria-label="はじまり">
    <img class="hero-big" src="assets/hero-sun.jpg" alt="たいようヒーロー">
    <p class="speech">石のしたに、かいじゅうが3匹ねてる。タッチして起こして、なかまにして！</p>
  </section>

  <section class="screen" id="play" aria-label="さがす">
    <div class="board" id="board"></div>
  </section>

  <section class="screen overlay" id="clear" aria-label="やった">
    <div class="glow" aria-hidden="true"></div>
    <p class="clear-title">なかまになった！</p>
    <div class="stars" aria-hidden="true">★ ★ ★</div>
    <div class="clear-actions">
      <button type="button" class="big-btn" id="again">もういっかい</button>
      <a class="big-btn" href="/">もどる</a>
    </div>
  </section>

  <script src="game.js"></script>
</body>
</html>
